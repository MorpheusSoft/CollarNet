<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2800 1100" width="2800" height="1100" style="background-color: #0b0f19; font-family: 'Roboto', 'Segoe UI', Arial, sans-serif;">
<defs>

      <pattern id="gridMinorDark" width="10" height="10" patternUnits="userSpaceOnUse">
        <circle cx="1" cy="1" r="0.6" fill="#1e293b" opacity="0.6"/>
      </pattern>
      <pattern id="gridMajorDark" width="50" height="50" patternUnits="userSpaceOnUse">
        <circle cx="1" cy="1" r="1.2" fill="#334155" opacity="0.8"/>
      </pattern>
      <pattern id="topGroundPour" width="12" height="12" patternUnits="userSpaceOnUse">
        <path d="M 0,0 L 12,12 M 12,0 L 0,12" stroke="#dc2626" stroke-width="0.8" opacity="0.25"/>
      </pattern>
      <pattern id="bottomGroundPour" width="12" height="12" patternUnits="userSpaceOnUse">
        <path d="M 0,0 L 12,12 M 12,0 L 0,12" stroke="#2563eb" stroke-width="0.8" opacity="0.25"/>
      </pattern>
      <filter id="pcbShadow" x="-5%" y="-5%" width="110%" height="110%">
        <feDropShadow dx="3" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
      </filter>
      <filter id="traceGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="1.5" result="blur"/>
        <feComposite in="SourceGraphic" in2="blur" operator="over"/>
      </filter>
    
</defs>
<rect width="2800" height="1100" fill="#0a0e17"/>
<rect width="2800" height="1100" fill="url(#gridMinorDark)"/>
<rect width="2800" height="1100" fill="url(#gridMajorDark)"/>
<rect x="35" y="35" width="2730" height="1030" fill="none" stroke="#334155" stroke-width="3"/>
<rect x="45" y="45" width="2710" height="1010" fill="none" stroke="#1e293b" stroke-width="1.5"/>

    <g transform="translate(60, 50)">
      <rect width="1800" height="50" rx="8" fill="#1e293b" stroke="#2563eb" stroke-width="2"/>
      <rect x="0" y="0" width="10" height="50" fill="#2563eb" rx="3"/>
      <text x="25" y="32" font-size="18" font-weight="bold" fill="#93c5fd" letter-spacing="1">COLLARNET V2 — CARA INFERIOR AISLADA (BOTTOM LAYER COPPER + CLIPS BATERÍA 21700 + NANO-SIM)</text>
      <text x="1400" y="32" font-size="12" font-weight="bold" fill="#94a3b8">DIMENSIONES: 110.60 × 33.10 mm</text>
    </g>
    
<rect x="180" y="180" width="2433.2" height="728.2" rx="66.0" fill="#064e3b" stroke="#10b981" stroke-width="2.5" filter="url(#pcbShadow)"/>

        <g transform="translate(235.55, 238.85)">
          <circle cx="0" cy="0" r="55.0" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
          <circle cx="0" cy="0" r="29.700000000000003" fill="#0a0e17"/>
          <text x="70.4" y="4" font-size="10" font-weight="bold" fill="#38bdf8" text-anchor="start">M2.5 (1)</text>
        </g>
        

        <g transform="translate(235.55, 849.35)">
          <circle cx="0" cy="0" r="55.0" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
          <circle cx="0" cy="0" r="29.700000000000003" fill="#0a0e17"/>
          <text x="70.4" y="4" font-size="10" font-weight="bold" fill="#38bdf8" text-anchor="start">M2.5 (2)</text>
        </g>
        

        <g transform="translate(2557.65, 238.85)">
          <circle cx="0" cy="0" r="55.0" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
          <circle cx="0" cy="0" r="29.700000000000003" fill="#0a0e17"/>
          <text x="-70.4" y="4" font-size="10" font-weight="bold" fill="#38bdf8" text-anchor="end">M2.5 (3)</text>
        </g>
        

        <g transform="translate(2557.65, 849.35)">
          <circle cx="0" cy="0" r="55.0" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
          <circle cx="0" cy="0" r="29.700000000000003" fill="#0a0e17"/>
          <text x="-70.4" y="4" font-size="10" font-weight="bold" fill="#38bdf8" text-anchor="end">M2.5 (4)</text>
        </g>
        

    <rect x="2006.0" y="268.0" width="44.0" height="552.2" rx="22.0" fill="#0a0e17" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="2028.0" y="544.1" font-size="9" font-weight="bold" fill="#ef4444" text-anchor="middle" transform="rotate(-90 2028.0 544.1)">RANURA FRESADA 2.0 mm (AISLAMIENTO HV &gt; 8 mm)</text>
    
<rect x="268.0" y="224.0" width="1716.0" height="640.2" fill="url(#bottomGroundPour)" opacity="0.4"/>
<rect x="2072.0" y="224.0" width="462.0" height="640.2" fill="url(#bottomGroundPour)" opacity="0.3"/>

    <g transform="translate(1236.0, 544.1)">
      <!-- 21700 Battery Body Outline on Bottom Silk -->
      <rect x="-792.0" y="-231.0" width="1584.0" height="462.0" rx="231.0" fill="#0f172a" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4"/>
      <rect x="-836.0" y="-88.0" width="44.0" height="176.0" fill="#fbbf24"/>
      <text x="0" y="4" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle" transform="scale(-1, 1)">CELDA LI-ION 21700 (5000 mAh / 3.7V)</text>
      <text x="0" y="24" font-size="10" fill="#94a3b8" text-anchor="middle" transform="scale(-1, 1)">CLIPS KEYSTONE 1042 / 1048 (SOLDADOS EN B.CU)</text>

      <!-- Negative Clip Pads (Left X=-26 mm) -->
      <circle cx="-572.0" cy="-99.0" r="39.6" fill="#fbbf24" stroke="#2563eb" stroke-width="1"/>
      <circle cx="-572.0" cy="99.0" r="39.6" fill="#fbbf24" stroke="#2563eb" stroke-width="1"/>
      <circle cx="-572.0" cy="-99.0" r="19.8" fill="#0a0e17"/>
      <circle cx="-572.0" cy="99.0" r="19.8" fill="#0a0e17"/>
      <text x="-572.0" y="-154.0" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle" transform="scale(-1, 1)">B- (GND)</text>

      <!-- Positive Clip Pads (Right X=+26 mm) -->
      <circle cx="572.0" cy="-99.0" r="39.6" fill="#fbbf24" stroke="#2563eb" stroke-width="1"/>
      <circle cx="572.0" cy="99.0" r="39.6" fill="#fbbf24" stroke="#2563eb" stroke-width="1"/>
      <circle cx="572.0" cy="-99.0" r="19.8" fill="#0a0e17"/>
      <circle cx="572.0" cy="99.0" r="19.8" fill="#0a0e17"/>
      <text x="572.0" y="-154.0" font-size="12" font-weight="bold" fill="#ef4444" text-anchor="middle" transform="scale(-1, 1)">B+ (VBAT)</text>
    </g>
    

    <g transform="translate(1324.0, 752.0)">
      <rect x="-132.0" y="-99.0" width="264.0" height="198.0" rx="1" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
      <text x="0" y="2" font-size="8" font-weight="bold" fill="#fbbf24" text-anchor="middle" transform="scale(-1, 1)">NANO-SIM SOCKET (B.CU)</text>
    </g>
    

    <g id="bottom_copper_traces" stroke="#2563eb" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" filter="url(#traceGlow)">
      <!-- Main Battery Ground Return Bus (3.0mm width) -->
      <path d="M 664.0,544.1 L 246.0,544.1" fill="none" stroke-width="4"/>
      <!-- Main VBAT Power Bus from Keystone Clip (3.0mm width) -->
      <path d="M 1808.0,544.1 L 840.0,544.1 L 840.0,730.0" fill="none" stroke-width="4"/>
      <!-- Isolated HV Ground on Bottom Layer in Sector 3 -->
      <path d="M 2248.0,741.0 L 2138.0,488.0 L 2138.0,752.0" fill="none" stroke="#7c3aed" stroke-width="4"/>
      <!-- GND Stitching Vias Matrix -->
      <circle cx="510.0" cy="356.0" r="8.8" fill="#fbbf24" stroke-width="0"/>
      <circle cx="620.0" cy="356.0" r="8.8" fill="#fbbf24" stroke-width="0"/>
      <circle cx="730.0" cy="356.0" r="8.8" fill="#fbbf24" stroke-width="0"/>
      <circle cx="840.0" cy="356.0" r="8.8" fill="#fbbf24" stroke-width="0"/>
      <circle cx="1610.0" cy="356.0" r="8.8" fill="#fbbf24" stroke-width="0"/>
      <circle cx="1720.0" cy="356.0" r="8.8" fill="#fbbf24" stroke-width="0"/>
    </g>
    
</svg>