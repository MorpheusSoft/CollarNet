<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2800 1800" width="2800" height="1800" style="background-color: #0b0f19; font-family: 'Segoe UI', Roboto, monospace, sans-serif;">

    <defs>
      <pattern id="pcbGrid" width="20" height="20" patternUnits="userSpaceOnUse">
        <circle cx="10" cy="10" r="0.8" fill="#1e293b"/>
      </pattern>
      <filter id="pcbGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="2.5" result="blur"/>
        <feComposite in="SourceGraphic" in2="blur" operator="over"/>
      </filter>
    </defs>
    <rect width="100%" height="100%" fill="#0a0e17"/>
    <rect width="100%" height="100%" fill="url(#pcbGrid)"/>
    <rect x="25" y="25" width="2750" height="1750" fill="none" stroke="#334155" stroke-width="2"/>
    <rect x="35" y="35" width="2730" height="1730" fill="none" stroke="#1e293b" stroke-width="1"/>
    

    <g transform="translate(60, 55)">
      <rect width="2000" height="70" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
      <rect x="0" y="0" width="12" height="70" fill="#0284c7" rx="3"/>
      <text x="30" y="44" font-size="24" font-weight="bold" fill="#38bdf8" letter-spacing="1">COLLARNET V2 — DISEÑO DE PCB: CÁPSULA IZQUIERDA (LÓGICA Y TELEMETRÍA)</text>
      <text x="1450" y="44" font-size="14" font-weight="bold" fill="#94a3b8">DIMENSIONES: 60.00 × 32.00 mm | 2 CAPAS FR4 1.6mm</text>
    </g>
    

    <!-- VIEW 1: TOP LAYER -->
    <g transform="translate(80, 200)">
      <text x="0" y="-20" font-size="18" font-weight="bold" fill="#ef4444">1. CARA SUPERIOR (TOP LAYER) — TRAZAS COBRE ROJO Y SERIGRAFÍA BLANCA</text>
      
      <!-- PCB Substrate -->
      <rect width="1080.0" height="576.0" rx="12" fill="#022c22" stroke="#10b981" stroke-width="2.5"/>
      <rect width="1080.0" height="576.0" rx="12" fill="#064e3b" opacity="0.35"/>

      <!-- Mounting Holes 4x M2.5 (dx=26.0 mm, dy=54.0 mm, margin: x=3.0, y=3.0) -->
      <!-- Hole 1: Top-Left -->
      <circle cx="54.0" cy="54.0" r="23.400000000000002" fill="#0a0e17" stroke="#fbbf24" stroke-width="1.8"/>
      <circle cx="54.0" cy="54.0" r="41.4" fill="none" stroke="#fbbf24" stroke-width="0.8" stroke-dasharray="3,2"/>
      
      <!-- Hole 2: Bottom-Left -->
      <circle cx="54.0" cy="522.0" r="23.400000000000002" fill="#0a0e17" stroke="#fbbf24" stroke-width="1.8"/>
      <circle cx="54.0" cy="522.0" r="41.4" fill="none" stroke="#fbbf24" stroke-width="0.8" stroke-dasharray="3,2"/>

      <!-- Hole 3: Top-Right -->
      <circle cx="1026.0" cy="54.0" r="23.400000000000002" fill="#0a0e17" stroke="#fbbf24" stroke-width="1.8"/>
      <circle cx="1026.0" cy="54.0" r="41.4" fill="none" stroke="#fbbf24" stroke-width="0.8" stroke-dasharray="3,2"/>

      <!-- Hole 4: Bottom-Right -->
      <circle cx="1026.0" cy="522.0" r="23.400000000000002" fill="#0a0e17" stroke="#fbbf24" stroke-width="1.8"/>
      <circle cx="1026.0" cy="522.0" r="41.4" fill="none" stroke="#fbbf24" stroke-width="0.8" stroke-dasharray="3,2"/>

      <!-- U4: CN3791 MPPT Solar Charger at X=6 to 16 mm, Y=5 to 17 mm -->
      <g transform="translate(108.0, 90.0)">
        <rect width="180.0" height="198.0" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="90.0" y="108.0" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">U4: CN3791</text>
        <text x="90.0" y="153.0" font-size="8" fill="#94a3b8" text-anchor="middle">MPPT 6V/1.2A</text>
      </g>

      <!-- L2: 10uH Inductor at X=6 to 14 mm, Y=19 to 27 mm -->
      <g transform="translate(108.0, 324.0)">
        <rect width="162.0" height="162.0" rx="3" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="81.0" y="90.0" font-size="11" font-weight="bold" fill="#fbbf24" text-anchor="middle">L2: 10µH</text>
        <text x="81.0" y="135.0" font-size="8" fill="#cbd5e1" text-anchor="middle">SMD 0630</text>
      </g>

      <!-- U5: SY8089 Buck 3.3V at X=18 to 25 mm, Y=5 to 14 mm -->
      <g transform="translate(324.0, 90.0)">
        <rect width="126.0" height="144.0" rx="2" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
        <text x="63.0" y="81.0" font-size="9" font-weight="bold" fill="#34d399" text-anchor="middle">U5: SY8089</text>
        <text x="63.0" y="126.0" font-size="7" fill="#cbd5e1" text-anchor="middle">3.3V 2A</text>
      </g>

      <!-- L1: 2.2uH Buck Inductor at X=18 to 25 mm, Y=16 to 24 mm -->
      <g transform="translate(324.0, 270.0)">
        <rect width="126.0" height="126.0" rx="2" fill="#0f172a" stroke="#34d399" stroke-width="1.2"/>
        <text x="63.0" y="72.0" font-size="9" font-weight="bold" fill="#34d399" text-anchor="middle">L1: 2.2µH</text>
      </g>

      <!-- U1: ESP32-S3-WROOM-1 at X=27 to 45 mm, Y=4 to 28 mm (18 x 25.5 mm) -->
      <g transform="translate(486.0, 72.0)">
        <rect width="324.0" height="441.0" rx="3" fill="#1e293b" stroke="#ffffff" stroke-width="1.8"/>
        <!-- RF Shield Cover -->
        <rect x="18.0" y="18.0" width="288.0" height="306.0" fill="#334155" stroke="#64748b" stroke-width="1"/>
        <text x="162.0" y="162.0" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">ESP32-S3</text>
        <text x="162.0" y="216.0" font-size="9" fill="#94a3b8" text-anchor="middle">WROOM-1</text>
        <!-- PCB Antenna Zone -->
        <rect x="18.0" y="333.0" width="288.0" height="90.0" fill="#0f172a" stroke="#eab308" stroke-width="1"/>
        <text x="162.0" y="392.40000000000003" font-size="8" font-weight="bold" fill="#eab308" text-anchor="middle">ANTENA PCB BLE/WIFI</text>
      </g>

      <!-- U3: SC7A20 IMU Accelerometer at X=20 to 25 mm, Y=24 to 29 mm -->
      <g transform="translate(333.0, 432.0)">
        <rect width="108.0" height="108.0" rx="1" fill="#1e293b" stroke="#34d399" stroke-width="1.2"/>
        <text x="54.0" y="68.39999999999999" font-size="8" font-weight="bold" fill="#34d399" text-anchor="middle">SC7A20</text>
      </g>

      <!-- J5: Dorsal Harness Connector (5-Pin 2.0mm JST-PH) at Right Edge X=48 to 56 mm, Y=6 to 26 mm -->
      <g transform="translate(855.0, 90.0)">
        <rect width="153.0" height="396.0" rx="3" fill="#ffffff" stroke="#eab308" stroke-width="2"/>
        <text x="76.5" y="63.0" font-size="9" font-weight="bold" fill="#ca8a04" text-anchor="middle">J5: ARNÉS DORSAL</text>
        <!-- 5 Pins -->
        <circle cx="76.5" cy="117.0" r="21.599999999999998" fill="#ef4444" stroke="#000000" stroke-width="0.8"/>
        <text x="126.0" y="126.0" font-size="7" font-weight="bold" fill="#ef4444">1:VBAT</text>

        <circle cx="76.5" cy="180.0" r="21.599999999999998" fill="#0284c7" stroke="#000000" stroke-width="0.8"/>
        <text x="126.0" y="189.0" font-size="7" font-weight="bold" fill="#0284c7">2:GND</text>

        <circle cx="76.5" cy="243.0" r="21.599999999999998" fill="#ea580c" stroke="#000000" stroke-width="0.8"/>
        <text x="126.0" y="252.0" font-size="7" font-weight="bold" fill="#ea580c">3:PWM</text>

        <circle cx="76.5" cy="306.0" r="21.599999999999998" fill="#a855f7" stroke="#000000" stroke-width="0.8"/>
        <text x="126.0" y="315.0" font-size="7" font-weight="bold" fill="#a855f7">4:TRIG</text>

        <circle cx="76.5" cy="369.0" r="21.599999999999998" fill="#facc15" stroke="#000000" stroke-width="0.8"/>
        <text x="126.0" y="378.0" font-size="7" font-weight="bold" fill="#ca8a04">5:SOLAR</text>
      </g>

      <!-- USB-C Port J1 on Left Edge X=0 to 5 mm, Y=10 to 22 mm -->
      <g transform="translate(0, 180.0)">
        <rect width="99.0" height="216.0" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
        <text x="48.6" y="117.0" font-size="8" font-weight="bold" fill="#0f172a" text-anchor="middle" transform="rotate(-90 48.6 117.0)">USB-C</text>
      </g>

      <!-- Top Copper Traces (Red) -->
      <g stroke="#ef4444" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
        <!-- 3.3V Power Trunk from SY8089 to ESP32 Pin 2 -->
        <path d="M 450.0,162.0 L 486.0,162.0"/>
        <!-- VBAT from J5 to CN3791 -->
        <path d="M 855.0,117.0 L 828.0,63.0 L 288.0,63.0 L 288.0,108.0"/>
        <!-- Audio PWM from ESP32 to J5 -->
        <path d="M 486.0,288.0 L 630.0,288.0 L 684.0,333.0 L 855.0,333.0" stroke="#ea580c" stroke-width="2"/>
        <!-- Impulse Trig from ESP32 to J5 -->
        <path d="M 486.0,324.0 L 630.0,324.0 L 684.0,396.0 L 855.0,396.0" stroke="#a855f7" stroke-width="2"/>
      </g>
    </g>
    

    <!-- VIEW 2: BOTTOM LAYER -->
    <g transform="translate(1500, 200)">
      <text x="0" y="-20" font-size="18" font-weight="bold" fill="#38bdf8">2. CARA INFERIOR (BOTTOM LAYER) — TRAZAS COBRE AZUL, MÓDEM 4G Y NANO-SIM</text>

      <!-- PCB Substrate (Mirrored view representation) -->
      <rect width="1080.0" height="576.0" rx="12" fill="#022c22" stroke="#10b981" stroke-width="2.5"/>
      <rect width="1080.0" height="576.0" rx="12" fill="#0c4a6e" opacity="0.35"/>

      <!-- Mounting Holes 4x M2.5 -->
      <circle cx="54.0" cy="54.0" r="23.400000000000002" fill="#0a0e17" stroke="#fbbf24" stroke-width="1.8"/>
      <circle cx="54.0" cy="522.0" r="23.400000000000002" fill="#0a0e17" stroke="#fbbf24" stroke-width="1.8"/>
      <circle cx="1026.0" cy="54.0" r="23.400000000000002" fill="#0a0e17" stroke="#fbbf24" stroke-width="1.8"/>
      <circle cx="1026.0" cy="522.0" r="23.400000000000002" fill="#0a0e17" stroke="#fbbf24" stroke-width="1.8"/>

      <!-- U2: SIM7670SA 4G LTE Modem at X=10 to 35 mm, Y=4 to 28 mm (24 x 24 mm) -->
      <g transform="translate(180.0, 72.0)">
        <rect width="432.0" height="432.0" rx="3" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
        <text x="216.0" y="180.0" font-size="15" font-weight="bold" fill="#67e8f9" text-anchor="middle">SIM7670SA</text>
        <text x="216.0" y="243.0" font-size="11" fill="#cbd5e1" text-anchor="middle">4G LTE CAT-1 + GNSS</text>
        <text x="216.0" y="297.0" font-size="9" fill="#94a3b8" text-anchor="middle">LGA-68 SMT Module</text>

        <!-- IPEX u.FL Connectors J3 & J4 -->
        <g transform="translate(27.0, 333.0)">
          <circle cx="36.0" cy="36.0" r="32.4" fill="#ef4444" stroke="#ffffff" stroke-width="1"/>
          <circle cx="36.0" cy="36.0" r="12.6" fill="#fbbf24"/>
          <text x="36.0" y="-9.0" font-size="8" font-weight="bold" fill="#ef4444" text-anchor="middle">J3: 4G</text>
        </g>
        <g transform="translate(333.0, 333.0)">
          <circle cx="36.0" cy="36.0" r="32.4" fill="#0284c7" stroke="#ffffff" stroke-width="1"/>
          <circle cx="36.0" cy="36.0" r="12.6" fill="#fbbf24"/>
          <text x="36.0" y="-9.0" font-size="8" font-weight="bold" fill="#38bdf8" text-anchor="middle">J4: GPS</text>
        </g>
      </g>

      <!-- Nano-SIM Tray at X=38 to 52 mm, Y=6 to 22 mm -->
      <g transform="translate(684.0, 108.0)">
        <rect width="252.0" height="288.0" rx="2" fill="#0f172a" stroke="#eab308" stroke-width="1.8"/>
        <text x="126.0" y="144.0" font-size="11" font-weight="bold" fill="#facc15" text-anchor="middle">NANO-SIM</text>
        <text x="126.0" y="198.0" font-size="9" fill="#cbd5e1" text-anchor="middle">PUSH-PULL 6P</text>
      </g>

      <!-- Tantalum 2x 220uF Capacitors at X=37 to 44 mm, Y=23 to 29 mm -->
      <g transform="translate(666.0, 423.0)">
        <rect width="131.4" height="77.39999999999999" rx="1" fill="#78350f" stroke="#fbbf24" stroke-width="1.2"/>
        <text x="65.7" y="50.4" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">C1: 220µF</text>
      </g>
      <g transform="translate(828.0, 423.0)">
        <rect width="131.4" height="77.39999999999999" rx="1" fill="#78350f" stroke="#fbbf24" stroke-width="1.2"/>
        <text x="65.7" y="50.4" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">C2: 220µF</text>
      </g>

      <!-- Bottom Copper Traces (Blue) -->
      <g stroke="#0284c7" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
        <!-- SIM Data bus -->
        <path d="M 612.0,180.0 L 684.0,180.0"/>
        <path d="M 612.0,225.0 L 684.0,225.0"/>
        <path d="M 612.0,270.0 L 684.0,270.0"/>
        <!-- Tantalum Cap Power Feed -->
        <path d="M 612.0,468.0 L 666.0,468.0 L 828.0,468.0" stroke="#38bdf8" stroke-width="3"/>
      </g>
    </g>
    

    <!-- DIMENSION CALLOUTS -->
    <g transform="translate(80, 826.0)">
      <!-- Width: 60.0 mm -->
      <line x1="0" y1="20" x2="1080.0" y2="20" stroke="#fbbf24" stroke-width="1.8"/>
      <line x1="0" y1="10" x2="0" y2="30" stroke="#fbbf24" stroke-width="1.8"/>
      <line x1="1080.0" y1="10" x2="1080.0" y2="30" stroke="#fbbf24" stroke-width="1.8"/>
      <polygon points="0,20 12,16 12,24" fill="#fbbf24"/>
      <polygon points="1080.0,20 1068.0,16 1068.0,24" fill="#fbbf24"/>
      <rect x="450.0" y="5" width="180" height="30" rx="4" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
      <text x="540.0" y="25" font-size="14" font-weight="bold" fill="#fbbf24" text-anchor="middle">LONGITUD: 60.00 mm</text>

      <!-- Mounting Hole Pitch dy: 54.0 mm -->
      <line x1="54.0" y1="60" x2="1026.0" y2="60" stroke="#38bdf8" stroke-width="1.5"/>
      <line x1="54.0" y1="50" x2="54.0" y2="70" stroke="#38bdf8" stroke-width="1.5"/>
      <line x1="1026.0" y1="50" x2="1026.0" y2="70" stroke="#38bdf8" stroke-width="1.5"/>
      <polygon points="54.0,60 64.0,56 64.0,64" fill="#38bdf8"/>
      <polygon points="1026.0,60 1016.0,56 1016.0,64" fill="#38bdf8"/>
      <rect x="440.0" y="45" width="200" height="30" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <text x="540.0" y="65" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle">PASO TORNILLOS dy = 54.00 mm</text>
    </g>
    

    <g transform="translate(80, 936.0)">
      <rect width="1300" height="350" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.8"/>
      <rect width="1300" height="35" rx="8" fill="#1e293b"/>
      <text x="25" y="24" font-size="14" font-weight="bold" fill="#38bdf8">REGLAS DE DISEÑO PCB (DRC) Y ESPECIFICACIONES DE FABRICACIÓN (JLCPCB)</text>
      
      <g transform="translate(30, 60)">
        <text x="0" y="25" font-size="13" fill="#cbd5e1">• Dimensiones del Contorno (Edge Cuts): <tspan font-weight="bold" fill="#ffffff">60.00 × 32.00 mm</tspan> (Tolerancia ±0.15mm)</text>
        <text x="0" y="55" font-size="13" fill="#cbd5e1">• Material del Sustrato: <tspan font-weight="bold" fill="#ffffff">FR4 Estándar TG150, Espesor 1.6 mm</tspan></text>
        <text x="0" y="85" font-size="13" fill="#cbd5e1">• Número de Capas: <tspan font-weight="bold" fill="#ffffff">2 Capas (Top Copper 1oz / Bottom Copper 1oz)</tspan></text>
        <text x="0" y="115" font-size="13" fill="#cbd5e1">• Taladros de Montaje: <tspan font-weight="bold" fill="#ffffff">4x Ø2.7 mm para tornillos M2.5</tspan> con paso transversal dx=26.0mm, longitudinal dy=54.0mm</text>
        <text x="0" y="145" font-size="13" fill="#cbd5e1">• Vías Estándar: <tspan font-weight="bold" fill="#ffffff">Diámetro 0.6 mm, Broca 0.3 mm (Anillo 0.15 mm)</tspan></text>
        <text x="0" y="175" font-size="13" fill="#cbd5e1">• Ancho Mínimo de Pista Señal: <tspan font-weight="bold" fill="#ffffff">0.20 mm (8 mil)</tspan> / Separación Mínima: <tspan font-weight="bold" fill="#ffffff">0.20 mm</tspan></text>
        <text x="0" y="205" font-size="13" fill="#cbd5e1">• Ancho Pistas Alimentación (VBAT / 3V3): <tspan font-weight="bold" fill="#ffffff">1.20 mm a 1.50 mm</tspan> (Soporta picos de 2.5A con &lt; 0.05V drop)</text>
        <text x="0" y="235" font-size="13" fill="#cbd5e1">• Máscara de Soldadura: <tspan font-weight="bold" fill="#10b981">Verde Mate / Brillo</tspan> | Serigrafía: <tspan font-weight="bold" fill="#ffffff">Blanco Alta Resolución</tspan></text>
        <text x="0" y="265" font-size="13" font-weight="bold" fill="#22c55e">✓ COMPATIBLE 100% CON ENSAMBLE AUTOMATIZADO JLCPCB SMT STANDARD</text>
      </g>
    </g>
    

    <g transform="translate(1500, 936.0)">
      <rect width="1220" height="350" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
      <rect width="1220" height="35" rx="8" fill="#0284c7"/>
      <text x="25" y="24" font-size="15" font-weight="bold" fill="#ffffff">COLLARNET V2 — CÁPSULA IZQUIERDA: RESUMEN DE COMPONENTES SMT</text>

      <g transform="translate(30, 60)">
        <text x="0" y="25" font-size="12" font-weight="bold" fill="#38bdf8">U1: ESP32-S3-WROOM-1-N16R8</text>
        <text x="320" y="25" font-size="12" fill="#cbd5e1">Microcontrolador Dual-Core 240MHz (Flash 16MB / PSRAM 8MB)</text>

        <text x="0" y="55" font-size="12" font-weight="bold" fill="#38bdf8">U2: SIMCom SIM7670SA-MNGV</text>
        <text x="320" y="55" font-size="12" fill="#cbd5e1">Módem Celular 4G LTE Cat-1 Multi-Banda + Receptor Satelital GNSS</text>

        <text x="0" y="85" font-size="12" font-weight="bold" fill="#38bdf8">U3: Silan SC7A20</text>
        <text x="320" y="85" font-size="12" fill="#cbd5e1">Acelerómetro Triaxial de Ultra-Bajo Consumo (6 µA @ 10Hz)</text>

        <text x="0" y="115" font-size="12" font-weight="bold" fill="#38bdf8">U4: Consonance CN3791</text>
        <text x="320" y="115" font-size="12" fill="#cbd5e1">Controlador de Carga Solar con Algoritmo MPPT (Corriente 1.2A)</text>

        <text x="0" y="145" font-size="12" font-weight="bold" fill="#38bdf8">U5: Silergy SY8089AAAC</text>
        <text x="320" y="145" font-size="12" fill="#cbd5e1">Regulador Reductor Síncrono Buck 3.3V / 2.0A (SOT-23-5)</text>

        <text x="0" y="175" font-size="12" font-weight="bold" fill="#38bdf8">C1, C2: 2x 220 µF / 6.3V</text>
        <text x="320" y="175" font-size="12" fill="#cbd5e1">Condensadores de Tantalio Polímero Case D para absorber picos 4G</text>

        <text x="0" y="205" font-size="12" font-weight="bold" fill="#38bdf8">J5: JST-PH 5-Pin 2.0 mm</text>
        <text x="320" y="205" font-size="12" fill="#cbd5e1">Conector de Arnés Dorsal hacia Placa Derecha (VBAT, GND, PWM, TRIG, SOLAR)</text>

        <text x="0" y="235" font-size="12" font-weight="bold" fill="#38bdf8">J1, J3, J4, J_SIM</text>
        <text x="320" y="235" font-size="12" fill="#cbd5e1">USB-C 16P, 2x IPEX/u.FL RF Hembra, Ranura Nano-SIM con protección TVS</text>

        <line x1="0" y1="255" x2="1160" y2="255" stroke="#334155" stroke-width="1"/>
        <text x="0" y="278" font-size="11" fill="#94a3b8">ARCHIVO DE FABRICACIÓN GERBER: CollarNet_V2_Logic_Gerber.zip | BOM LCSC LISTO | CPL PICK &amp; PLACE DISPONIBLE</text>
      </g>
    </g>
    
</svg>