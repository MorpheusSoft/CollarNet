<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2800 1800" width="2800" height="1800" style="background-color: #0b0f19; font-family: 'Segoe UI', Roboto, monospace, sans-serif;">

    <defs>
      <pattern id="pcbGridPower" width="20" height="20" patternUnits="userSpaceOnUse">
        <circle cx="10" cy="10" r="0.8" fill="#1e293b"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="#0a0e17"/>
    <rect width="100%" height="100%" fill="url(#pcbGridPower)"/>
    <rect x="25" y="25" width="2750" height="1750" fill="none" stroke="#334155" stroke-width="2"/>
    <rect x="35" y="35" width="2730" height="1730" fill="none" stroke="#1e293b" stroke-width="1"/>
    

    <g transform="translate(60, 55)">
      <rect width="2000" height="70" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
      <rect x="0" y="0" width="12" height="70" fill="#a855f7" rx="3"/>
      <text x="30" y="44" font-size="24" font-weight="bold" fill="#d8b4fe" letter-spacing="1">COLLARNET V2 — DISEÑO DE PCB: CÁPSULA DERECHA (POTENCIA Y DESCARGA CDI)</text>
      <text x="1420" y="44" font-size="14" font-weight="bold" fill="#94a3b8">DIMENSIONES: 32.00 × 26.00 mm | RANURA AISLAMIENTO 2.0 mm</text>
    </g>
    

    <!-- VIEW 1: TOP LAYER -->
    <g transform="translate(120, 200)">
      <text x="0" y="-20" font-size="18" font-weight="bold" fill="#ef4444">1. CARA SUPERIOR (TOP LAYER) — TRAZAS COBRE, COMPONENTES SMD Y RANURA DE AISLAMIENTO</text>
      
      <!-- PCB Substrate -->
      <rect width="896.0" height="728.0" rx="12" fill="#022c22" stroke="#10b981" stroke-width="2.5"/>
      <rect width="896.0" height="728.0" rx="12" fill="#064e3b" opacity="0.35"/>

      <!-- Mounting Holes 4x M2.5 (dx=20.0 mm, dy=26.0 mm, margin: x=3.0, y=3.0) -->
      <circle cx="84.0" cy="84.0" r="36.4" fill="#0a0e17" stroke="#fbbf24" stroke-width="1.8"/>
      <circle cx="84.0" cy="644.0" r="36.4" fill="#0a0e17" stroke="#fbbf24" stroke-width="1.8"/>
      <circle cx="812.0" cy="84.0" r="36.4" fill="#0a0e17" stroke="#fbbf24" stroke-width="1.8"/>
      <circle cx="812.0" cy="644.0" r="36.4" fill="#0a0e17" stroke="#fbbf24" stroke-width="1.8"/>

      <!-- DIELECTRIC ISOLATION SLOT (2.0 mm milled slot through FR4 at X=17.5 mm) -->
      <g transform="translate(476.0, 56.0)">
        <rect width="56.0" height="616.0" rx="28.0" fill="#090d16" stroke="#facc15" stroke-width="2" stroke-dasharray="6,3"/>
        <text x="28.0" y="308.0" font-size="10" font-weight="bold" fill="#facc15" text-anchor="middle" transform="rotate(-90 28.0 308.0)">RANURA AISLAMIENTO 2.0 mm (CREEPAGE &gt; 8mm)</text>
      </g>

      <!-- SECTOR 1 (LEFT): LOW VOLTAGE LOGIC & AUDIO (X=0 to 17 mm) -->
      <!-- J6 Harness Connector (5-Pin 2.0mm) at X=1.5 to 6 mm, Y=6 to 20 mm -->
      <g transform="translate(42.0, 140.0)">
        <rect width="126.0" height="448.0" rx="2" fill="#ffffff" stroke="#eab308" stroke-width="1.5"/>
        <text x="63.0" y="70.0" font-size="7" font-weight="bold" fill="#ca8a04" text-anchor="middle">J6 ARNÉS</text>
        <circle cx="63.0" cy="140.0" r="22.400000000000002" fill="#ef4444"/>
        <circle cx="63.0" cy="210.0" r="22.400000000000002" fill="#0284c7"/>
        <circle cx="63.0" cy="280.0" r="22.400000000000002" fill="#ea580c"/>
        <circle cx="63.0" cy="350.0" r="22.400000000000002" fill="#a855f7"/>
        <circle cx="63.0" cy="420.0" r="22.400000000000002" fill="#facc15"/>
      </g>

      <!-- BMS U6 (DW01A) & U7 (FS8205A) at X=7 to 11 mm, Y=4 to 12 mm -->
      <g transform="translate(196.0, 112.0)">
        <rect width="112.0" height="98.0" rx="1" fill="#1e293b" stroke="#22c55e" stroke-width="1.2"/>
        <text x="56.0" y="64.39999999999999" font-size="7" font-weight="bold" fill="#4ade80" text-anchor="middle">DW01A</text>
        <rect y="126.0" width="112.0" height="112.0" rx="1" fill="#1e293b" stroke="#22c55e" stroke-width="1.2"/>
        <text x="56.0" y="196.0" font-size="7" font-weight="bold" fill="#4ade80" text-anchor="middle">FS8205A</text>
      </g>

      <!-- Driver Q1 (AO3400A) at X=7 to 11 mm, Y=14 to 18 mm -->
      <g transform="translate(196.0, 392.0)">
        <rect width="112.0" height="98.0" rx="1" fill="#1e293b" stroke="#ea580c" stroke-width="1.2"/>
        <text x="56.0" y="64.39999999999999" font-size="7" font-weight="bold" fill="#fdba74" text-anchor="middle">AO3400A</text>
      </g>

      <!-- Piezo Buzzer BZ1 at X=11.5 to 16.5 mm, Y=14 to 24 mm -->
      <g transform="translate(322.0, 378.0)">
        <circle cx="70.0" cy="140.0" r="98.0" fill="#2d150b" stroke="#ea580c" stroke-width="2"/>
        <circle cx="70.0" cy="140.0" r="42.0" fill="#fed7aa"/>
        <text x="70.0" y="154.0" font-size="8" font-weight="bold" fill="#ea580c" text-anchor="middle">95dB</text>
      </g>

      <!-- U8: Optocoupler EL817C Bridging the Boundary (X=14 to 19 mm, Y=4 to 10 mm) -->
      <g transform="translate(392.0, 112.0)">
        <rect width="154.0" height="140.0" rx="1.5" fill="#1e293b" stroke="#a855f7" stroke-width="1.8"/>
        <text x="77.0" y="78.39999999999999" font-size="8" font-weight="bold" fill="#d8b4fe" text-anchor="middle">EL817C</text>
        <text x="77.0" y="120.39999999999999" font-size="6" font-weight="bold" fill="#facc15" text-anchor="middle">5kV OPTO</text>
      </g>

      <!-- SECTOR 2 (RIGHT): HIGH VOLTAGE CDI (X=19 to 32 mm) -->
      <!-- U9: Watchdog 74LVC1G123 at X=20 to 24 mm, Y=4 to 9 mm -->
      <g transform="translate(560.0, 112.0)">
        <rect width="112.0" height="126.0" rx="1" fill="#1e293b" stroke="#ef4444" stroke-width="1.2"/>
        <text x="56.0" y="70.0" font-size="7" font-weight="bold" fill="#f87171" text-anchor="middle">WATCHDOG</text>
        <text x="56.0" y="112.0" font-size="6" fill="#cbd5e1" text-anchor="middle">1000ms MAX</text>
      </g>

      <!-- MOD_HV Flyback Transformer at X=20 to 27 mm, Y=10 to 18 mm -->
      <g transform="translate(560.0, 266.0)">
        <rect width="196.0" height="196.0" rx="2" fill="#1e293b" stroke="#7c3aed" stroke-width="1.5"/>
        <rect x="42.0" y="42.0" width="112.0" height="112.0" fill="#0f172a" stroke="#475569" stroke-width="1"/>
        <text x="98.0" y="106.39999999999999" font-size="7" font-weight="bold" fill="#c084fc" text-anchor="middle">FLYBACK</text>
        <text x="98.0" y="154.0" font-size="6" font-weight="bold" fill="#ef4444" text-anchor="middle">1000V DC</text>
      </g>

      <!-- C7: CDI Film Capacitor 0.1uF 1000V CBB21 at X=25 to 30.5 mm, Y=4 to 9 mm -->
      <g transform="translate(700.0, 112.0)">
        <rect width="154.0" height="126.0" rx="1" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
        <text x="77.0" y="70.0" font-size="7" font-weight="bold" fill="#ffffff" text-anchor="middle">C7: 0.1µF</text>
        <text x="77.0" y="112.0" font-size="6" font-weight="bold" fill="#facc15" text-anchor="middle">1000V CBB</text>
      </g>

      <!-- TH1: SCR Thyristor TYN1225RG (DPAK) at X=25 to 30.5 mm, Y=10 to 16 mm -->
      <g transform="translate(700.0, 266.0)">
        <rect width="154.0" height="140.0" rx="1" fill="#1e293b" stroke="#7c3aed" stroke-width="1.5"/>
        <text x="77.0" y="78.39999999999999" font-size="7" font-weight="bold" fill="#d8b4fe" text-anchor="middle">TH1: SCR</text>
        <text x="77.0" y="120.39999999999999" font-size="6" fill="#cbd5e1" text-anchor="middle">TYN1225</text>
      </g>

      <!-- R_LIM: Resistor 220Ω / 2W at X=20 to 29 mm, Y=18 to 22 mm -->
      <g transform="translate(560.0, 504.0)">
        <rect width="252.0" height="98.0" rx="1" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
        <text x="126.0" y="64.39999999999999" font-size="7" font-weight="bold" fill="#fbbf24" text-anchor="middle">R_LIM: 220Ω / 2W (ANTI-QUEMADURA)</text>
      </g>
    </g>
    

    <!-- VIEW 2: BOTTOM LAYER -->
    <g transform="translate(1500, 200)">
      <text x="0" y="-20" font-size="18" font-weight="bold" fill="#38bdf8">2. CARA INFERIOR (BOTTOM LAYER) — ELECTRODOS M4 Y CLIPS BATERÍA 21700</text>

      <!-- PCB Substrate -->
      <rect width="896.0" height="728.0" rx="12" fill="#022c22" stroke="#10b981" stroke-width="2.5"/>
      <rect width="896.0" height="728.0" rx="12" fill="#0c4a6e" opacity="0.35"/>

      <!-- Mounting Holes -->
      <circle cx="84.0" cy="84.0" r="36.4" fill="#0a0e17" stroke="#fbbf24" stroke-width="1.8"/>
      <circle cx="84.0" cy="644.0" r="36.4" fill="#0a0e17" stroke="#fbbf24" stroke-width="1.8"/>
      <circle cx="812.0" cy="84.0" r="36.4" fill="#0a0e17" stroke="#fbbf24" stroke-width="1.8"/>
      <circle cx="812.0" cy="644.0" r="36.4" fill="#0a0e17" stroke="#fbbf24" stroke-width="1.8"/>

      <!-- Dielectric Slot Representation -->
      <g transform="translate(476.0, 56.0)">
        <rect width="56.0" height="616.0" rx="28.0" fill="#090d16" stroke="#facc15" stroke-width="2" stroke-dasharray="6,3"/>
      </g>

      <!-- Battery Clips Keystone 1042/1048 -->
      <g transform="translate(56.0, 140.0)">
        <rect width="336.0" height="448.0" rx="3" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
        <text x="168.0" y="196.0" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">CLIP BATERÍA 21700</text>
        <text x="168.0" y="280.0" font-size="10" fill="#bbf7d0" text-anchor="middle">KEYSTONE 1042 / 1048</text>
        <text x="168.0" y="364.0" font-size="9" fill="#e2e8f0" text-anchor="middle">Polo Positivo (+) con Fusible F1</text>
      </g>

      <!-- EL1 & EL2 Neck Electrode Pads M4 (Hole Ø4.2mm, Pad Ø8.0mm) -->
      <!-- EL1 HV (+) at X=22 mm, Y=17 mm -->
      <g transform="translate(616.0, 448.0)">
        <circle cx="0" cy="0" r="106.39999999999999" fill="#fbbf24" stroke="#ef4444" stroke-width="3"/>
        <circle cx="0" cy="0" r="58.800000000000004" fill="#0a0e17"/>
        <text x="0" y="-120.39999999999999" font-size="10" font-weight="bold" fill="#ef4444" text-anchor="middle">EL1: HV (+)</text>
        <text x="0" y="145.6" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">PERNO M4</text>
      </g>

      <!-- EL2 RET (-) at X=27.5 mm, Y=8 mm -->
      <g transform="translate(770.0, 224.0)">
        <circle cx="0" cy="0" r="106.39999999999999" fill="#fbbf24" stroke="#7c3aed" stroke-width="3"/>
        <circle cx="0" cy="0" r="58.800000000000004" fill="#0a0e17"/>
        <text x="0" y="-120.39999999999999" font-size="10" font-weight="bold" fill="#c084fc" text-anchor="middle">EL2: RET (-)</text>
        <text x="0" y="145.6" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">PERNO M4</text>
      </g>

      <!-- Isolated HV Ground Pour Zone -->
      <g transform="translate(546.0, 56.0)">
        <rect width="308.0" height="616.0" rx="2" fill="#581c87" opacity="0.3" stroke="#a855f7" stroke-width="1.2" stroke-dasharray="4,2"/>
        <text x="154.0" y="588.0" font-size="8" font-weight="bold" fill="#c084fc" text-anchor="middle">ZONA TIERRA AISLADA HV_GND</text>
      </g>
    </g>
    

    <!-- SPECIFICATIONS & MECHANICAL DETAILS -->
    <g transform="translate(120, 968.0)">
      <rect width="1280" height="420" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.8"/>
      <rect width="1280" height="35" rx="8" fill="#1e293b"/>
      <text x="25" y="24" font-size="14" font-weight="bold" fill="#d8b4fe">COTAS MECÁNICAS Y PARÁMETROS DIELÉCTRICOS DE AISLAMIENTO</text>
      
      <g transform="translate(30, 60)">
        <text x="0" y="25" font-size="13" fill="#cbd5e1">• Dimensiones de Placa: <tspan font-weight="bold" fill="#ffffff">32.00 × 26.00 mm</tspan> (Espesor FR4: 1.6 mm, Cobre: 1oz/1oz)</text>
        <text x="0" y="55" font-size="13" fill="#cbd5e1">• Ranura de Fresado Dieléctrico: <tspan font-weight="bold" fill="#facc15">Ancho 2.0 mm, Longitud 22.0 mm</tspan> (Corta FR4 de lado a lado)</text>
        <text x="0" y="85" font-size="13" fill="#cbd5e1">• Distancia de Fuga (Creepage): <tspan font-weight="bold" fill="#22c55e">&gt; 8.0 mm</tspan> (Cumple norma IEC 60664-1 para 1000V DC)</text>
        <text x="0" y="115" font-size="13" fill="#cbd5e1">• Aislamiento Galvánico Optoacoplador: <tspan font-weight="bold" fill="#38bdf8">5000 Vrms (EL817C SMD)</tspan></text>
        <text x="0" y="145" font-size="13" fill="#cbd5e1">• Protección Térmica Dérmica: <tspan font-weight="bold" fill="#ef4444">Resistencia 220 Ω / 2W</tspan> limitadora de corriente de pico</text>
        <text x="0" y="175" font-size="13" fill="#cbd5e1">• Seguro por Hardware: <tspan font-weight="bold" fill="#ffffff">Watchdog Monoestable 74LVC1G123 (Corte a 1000ms)</tspan></text>
        <text x="0" y="205" font-size="13" fill="#cbd5e1">• Taladros Tornillos Chasis: <tspan font-weight="bold" fill="#ffffff">4x Ø2.7 mm (M2.5)</tspan>, paso longitudinal 26.0mm, paso transversal 20.0mm</text>
        <text x="0" y="235" font-size="13" fill="#cbd5e1">• Puntos de Contacto Animal: <tspan font-weight="bold" fill="#ffffff">2x Pernos Inox M4</tspan> con cabeza semiesférica y O-ring</text>
        <text x="0" y="265" font-size="13" fill="#cbd5e1">• Conector Intercápsula: <tspan font-weight="bold" fill="#ffffff">J6 JST-PH 5 Pines 2.0 mm</tspan> (AWG 24 alimentación / AWG 26 control)</text>
        <text x="0" y="295" font-size="13" font-weight="bold" fill="#22c55e">✓ COMPATIBLE 100% CON ENSAMBLE JLCPCB SMT 2-LAYER STANDARD</text>
      </g>
    </g>
    

    <g transform="translate(1500, 968.0)">
      <rect width="1220" height="420" rx="8" fill="#0f172a" stroke="#7c3aed" stroke-width="2"/>
      <rect width="1220" height="35" rx="8" fill="#6d28d9"/>
      <text x="25" y="24" font-size="15" font-weight="bold" fill="#ffffff">COLLARNET V2 — CÁPSULA DERECHA: RESUMEN DE COMPONENTES BOM</text>

      <g transform="translate(30, 60)">
        <text x="0" y="25" font-size="12" font-weight="bold" fill="#d8b4fe">BAT1: Celda Li-Ion 21700</text>
        <text x="320" y="25" font-size="12" fill="#cbd5e1">5000 mAh / 3.7V con Clips Keystone 1042/1048 para alta vibración</text>

        <text x="0" y="55" font-size="12" font-weight="bold" fill="#d8b4fe">U6 + U7: DW01A + FS8205A</text>
        <text x="320" y="55" font-size="12" fill="#cbd5e1">Protección BMS contra sobrecarga, sobredescarga y cortocircuito</text>

        <text x="0" y="85" font-size="12" font-weight="bold" fill="#d8b4fe">F1: PPTC 3.0A (1812)</text>
        <text x="320" y="85" font-size="12" fill="#cbd5e1">Fusible reseteable en línea positiva del arnés dorsal intercápsula</text>

        <text x="0" y="115" font-size="12" font-weight="bold" fill="#d8b4fe">BZ1: Buzzer Piezo 95 dB</text>
        <text x="320" y="115" font-size="12" fill="#cbd5e1">Zumbador pasivo Ø12.4mm comandado por MOSFET AO3400A (30V / 5.7A)</text>

        <text x="0" y="145" font-size="12" font-weight="bold" fill="#d8b4fe">U8: Everlight EL817C</text>
        <text x="320" y="145" font-size="12" fill="#cbd5e1">Optoacoplador de aislamiento galvánico de alta tensión (5000 Vrms)</text>

        <text x="0" y="175" font-size="12" font-weight="bold" fill="#d8b4fe">U9: 74LVC1G123 (VSSOP-8)</text>
        <text x="320" y="175" font-size="12" fill="#cbd5e1">Watchdog hardware monoestable con límite irreversible de 1000 ms</text>

        <text x="0" y="205" font-size="12" font-weight="bold" fill="#d8b4fe">MOD_HV + Diodos 2kV</text>
        <text x="320" y="205" font-size="12" fill="#cbd5e1">Mini bobina flyback osciladora que eleva de 3.7V a 1000V DC</text>

        <text x="0" y="235" font-size="12" font-weight="bold" fill="#d8b4fe">C7: 0.1 µF / 1000V CBB21</text>
        <text x="320" y="235" font-size="12" fill="#cbd5e1">Condensador film metalizado de almacenamiento CDI (0.05 Joules)</text>

        <text x="0" y="265" font-size="12" font-weight="bold" fill="#d8b4fe">TH1: TYN1225RG (TO-252)</text>
        <text x="320" y="265" font-size="12" fill="#cbd5e1">Tiristor SCR 1200V / 25A para conmutación ultrarrápida del pulso</text>

        <text x="0" y="295" font-size="12" font-weight="bold" fill="#d8b4fe">R_LIM (220Ω 2W) + R_BLEED</text>
        <text x="320" y="295" font-size="12" fill="#cbd5e1">Limitación de choque fisiológico seguro y autodescarga en reposo</text>

        <text x="0" y="325" font-size="12" font-weight="bold" fill="#d8b4fe">EL1, EL2: Pernos M4 Inox</text>
        <text x="320" y="325" font-size="12" fill="#cbd5e1">Electrodos de contacto directo con cuello de ganado sellados con O-ring</text>
      </g>
    </g>
    
</svg>