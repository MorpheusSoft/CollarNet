  <!-- Division de cuadrantes Vaca -->
  <line x1="191.55" y1="23.099999999999994" x2="191.55" y2="356.9" stroke="#10b981" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="10.0" y1="190.0" x2="373.1" y2="190.0" stroke="#10b981" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- Orificios Keyhole Vaca (Cruz roja para taladrar/marcar en pared) -->
  <!-- TL: -60, 95 -->
  <g transform="translate(131.55, 95.0)">
